  1: Frame the problem
  2: Get data
  3: Understand data
  4: Clean
  5: Engineer features
  6: Reduce dimensions
  7: Split
  8: Model
  9: Evaluate
  10: Tune
  11: Deploy
  12: Test
  13: Monitor and maintain

