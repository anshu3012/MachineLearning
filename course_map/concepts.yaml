# The Course map data. Every view of the Course map and every Note's "Where this fits" box is generated from this file.
#
# status: confirmed = taught in a written, reviewed Note; draft = guessed from playlist titles, to be checked against
#         the transcript when its Note is written ("transcript first, map second", see README).
# links:  [from, type, to, status]. type is exactly one of: needs, is a kind of, fixes, compared with, used in.

steps:
