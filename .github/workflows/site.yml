name: Publish site

on:
  push:
    branches: [main]
    paths:
      - "MA/**"
      - "ML/**"
      - "DL/**"
      - "00-course-map/**"
      - "glossary.md"
      - "site/**"
      - ".github/workflows/site.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Clone Quartz
        run: git clone --depth 1 --branch v4 https://github.com/jackyzha0/quartz.git quartz

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: quartz/package-lock.json

      - name: Check the course structure (docs/STRUCTURE.md)
        run: pip install --quiet pyyaml plotly && python3 tools/check_structure.py

      - name: Copy Notes and config into Quartz
        run: bash site/build-content.sh quartz

      - name: Build
        working-directory: quartz
        run: npm ci && npx quartz build

      - name: Give figures their size (stops section links landing short)
        run: python3 site/img_sizes.py quartz/public

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: quartz/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
