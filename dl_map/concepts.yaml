# Draft Course map data for the CampusX "100 Days of Deep Learning" playlist (84 Videos). Same format as
# course_map/concepts.yaml. Everything is draft: guessed from playlist titles and checked against the first transcripts,
# to be confirmed per Note ("transcript first, map second", see README).
#
# links:    [from, type, to, status], both ends in this file. type is exactly one of: needs, is a kind of, fixes,
#           compared with, used in.
# ml_links: same, but the "to" end is an id in course_map/concepts.yaml (the ML map). check.py verifies both.
# ids never repeat an ML id, so the two files can be merged later without clashes.

# Same 14 steps as the ML map, so the two maps line up. DL Videos only use 0, 5, 8, 9 and 10 (see PLAN.md).
steps:
  0: Foundations
  1: Frame the problem
  2: Get data
  3: Understand data
  4: Clean
  5: Engineer features
  6: Reduce dimensions
  7: Split
  8: Model
  9: Evaluate
  10: Tune
  11: Deploy
  12: Test
  13: Monitor and maintain

